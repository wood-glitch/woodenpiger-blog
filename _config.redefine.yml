# COLORS >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/basic/colors
colors:
  #Primary color
  primary: "#38BDF8"
  # Secondary color (TBD)
  secondary: "#60A5FA"
  # Default theme mode initial value (will be overwritten by prefer-color-scheme)
  default_mode: dark # light, dark
# COLORS <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# SITE CUSTOMIZATION >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/basic/global
global:
  # Custom global fonts
  fonts:
    # Chinese fonts
    chinese: 
      enable: false
      family: 
      url: 
    # English fonts
    english: 
      enable: false
      family: 
      url: 
    # Custom title fonts (navbar, sidebar)
    title:
      enable: false
      family: 
      url: 
  # Content max width
  content_max_width: 1080px
  # Sidebar width
  sidebar_width: 220px
  # Effects on mouse hover
  hover:
    shadow: true # shadow effect
    scale: false # scale effect
  # Scroll progress
  scroll_progress:
    bar: true # progress bar
    percentage: true # percentage
  # Website counter
  website_counter:
    url: https://events.vercount.one/js
    enable: true # enable website counter or not
    site_pv: true # site page view
    site_uv: true # site unique visitor
    post_pv: true # post page view
  # Whether to enable single page experience (using swup). See https://swup.js.org/. similar to pjax
  single_page: true
  # Whether to enable Preloader.
  preloader:
    enable: false
    custom_message:
  # Side tools settings
  side_tools:
    gear_rotation: true
    auto_expand: false
  # Whether to enable open graph
  open_graph:
    enable: true
    image: /images/a90428f5efd2412853c30195c548bb8a.jpg
    description: WoodenPiger 的个人技术博客，记录 AI 编程、Claude Code、Codex、OpenCode、自建服务与开发工具折腾实践。
  # Google Analytics
  google_analytics:
    enable: false
    id: 
# SITE CUSTOMIZATION <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end
    

# FONTAWESOME >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/basic/fontawesome
fontawesome: # Pro v6.2.1
  thin: false
  light: false
  duotone: false
  sharp_solid: false
# FONTAWESOME <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# HOME BANNER >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/home/home_banner
home_banner:
  # Whether to enable home banner
  enable: true
  # style of home banner
  style: static # static or fixed
  # Home banner image
  image: 
    light: /images/banner-light.svg # light mode
    dark: /images/banner-dark.svg # dark mode
  # Home banner title
  title: WoodenPiger's Blog
  # Home banner subtitle
  subtitle:
    text:
      - "记录 AI 编程、开发工具与折腾过程"
      - "Claude Code · Codex · OpenCode · Linux 自托管实践"
    hitokoto:
      enable: false
      show_author: false
      api: https://v1.hitokoto.cn
    typing_speed: 90
    backing_speed: 60
    starting_delay: 400
    backing_delay: 1800
    loop: true
    smart_backspace: true
  # Color of home banner text
  text_color: 
    light: "#202124" # light mode
    dark: "#e8e8e8" # dark mode
  # Specific style of the text
  text_style: 
    title_size: 2.6rem
    subtitle_size: 1.15rem
    line_height: 1.35
  # Home banner custom font
  custom_font: 
    enable: false
    family: 
    url:
  # Home banner social links
  social_links:
    enable: true
    style: default # default, reverse, center
    links:
      - icon: github
        url: https://github.com/wood-glitch
        title: "GitHub: wood-glitch"
        aria_label: "GitHub: wood-glitch"
      - icon: x-twitter
        url: https://x.com/WWwklw
        title: "X (Twitter): @WWwklw"
        aria_label: "X (Twitter): @WWwklw"
      - icon: qq
        url: "3615825554"
        action: copy
        copy: "3615825554"
        title: "QQ: 3615825554（点击复制）"
        aria_label: "QQ: 3615825554（点击复制）"
        toast: "已复制 QQ 号：3615825554"
      - icon: email
        url: "3615825554@qq.com"
        action: copy
        copy: "3615825554@qq.com"
        title: "邮箱: 3615825554@qq.com（点击复制）"
        aria_label: "邮箱: 3615825554@qq.com（点击复制）"
        toast: "已复制邮箱：3615825554@qq.com"
# HOME BANNER <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# NAVIGATION BAR >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
