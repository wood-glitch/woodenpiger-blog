# HOME PAGE ARTICLE SETTINGS >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/home/home
home:
  sidebar:
    enable: true
    position: left
    first_item: info
    announcement: "记录 AI 编程、开发工具与折腾过程"
    show_on_mobile: true
    links:
      归档: 
        path: /archives 
        icon: fa-regular fa-archive
      分类: 
        path: /categories 
        icon: fa-regular fa-folder
      标签: 
        path: /tags 
        icon: fa-regular fa-tags
      关于:
        path: /about
        icon: fa-regular fa-user
      打赏: 
        path: /donate 
        icon: fa-regular fa-qrcode
  article_date_format: YYYY-MM-DD
  excerpt_length: 160
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 4
# HOME PAGE ARTICLE SETTINGS <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


# ARTICLE >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> start
# Docs: https://redefine-docs.ohevan.com/posts/articles
articles:
  style:
    font_size: 16px
    line_height: 1.8
    image_border_radius: 12px
    image_alignment: center
    image_caption: false
    link_icon: true
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 2.8rem
      h2: 2.2rem
      h3: 1.75rem
      h4: 1.45rem
      h5: 1.25rem
      h6: 1.15rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label: 
    enable: true
    auto: false
    list:
      - "Lv6"
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: github-dark
    font:
      enable: false
      family: 
      url: 
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: true
    default: cc_by_nc_sa
  lazyload: true
  pangu_js: false
  recommendation:
    enable: false
    title: 推荐阅读
    limit: 3
    mobile_limit: 2
    skip_dirs: []
# ARTICLE <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< end


